# https://llm-wiki.vsda.top -> LLM Wiki container (noVNC on host 127.0.0.1:5800)
#
# Install (needs root):
#   sudo cp docker/nginx/llm-wiki.vsda.top.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name llm-wiki.vsda.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name llm-wiki.vsda.top;
    error_page 497 https://$server_name:$server_port$request_uri;
    include snippets/vsda.top.conf;
    include snippets/ssl-params.conf;

    client_max_body_size 0;

    location / {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_pass http://127.0.0.1:5800;
        proxy_redirect off;

        # noVNC streams the session over a long-lived WebSocket.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }
}
